openapi: 3.1.0
info:
  title: Book Video Workspace API
  version: 0.4.0
  description: G4 frozen contract for the W4 research desk, metric evidence, content references, evidence-based style cards and CSV import. Local single-user implementation may use a development identity; every private record is owner-scoped. v0.3 paths and request fields remain valid.
servers:
  - url: http://127.0.0.1:8000/api/v1
paths:
  /books:
    get:
      operationId: listBooks
      summary: List the current owner's book editions
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: q
          in: query
          required: false
          description: Trimmed case-insensitive search across title, author, and ISBN
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Stable descending created_at/id page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPage' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createBook
      summary: Create one book edition with manually supplied facts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEdition' }
        '422': { $ref: '#/components/responses/Error' }
  /books/{book_id}:
    get:
      operationId: getBook
      parameters:
        - { $ref: '#/components/parameters/BookId' }
      responses:
        '200':
          description: Book edition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEdition' }
        '404': { $ref: '#/components/responses/Error' }
  /books/{book_id}/facts/{fact_key}:
    patch:
      operationId: reviseBookFact
      summary: Append a fact revision for this exact book edition
      parameters:
        - { $ref: '#/components/parameters/BookId' }
        - { $ref: '#/components/parameters/FactKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookFactRevisionRequest' }
      responses:
        '200':
          description: New fact revision; old revisions and approved script snapshots remain immutable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookFactRevision' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /books/{book_id}/facts/{fact_key}/revisions:
    get:
      operationId: listBookFactRevisions
      parameters:
        - { $ref: '#/components/parameters/BookId' }
        - { $ref: '#/components/parameters/FactKey' }
      responses:
        '200':
          description: All revisions of this owner's fact in ascending revision order
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BookFactRevision' } }
        '404': { $ref: '#/components/responses/Error' }
  /promotion-candidates:
    post:
      operationId: createPromotionCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionCandidateCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionCandidate' }
        '422': { $ref: '#/components/responses/Error' }
  /promotion-candidates/{candidate_id}:
    get:
      operationId: getPromotionCandidate
      parameters:
        - { $ref: '#/components/parameters/CandidateId' }
      responses:
        '200':
          description: Candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionCandidate' }
        '404': { $ref: '#/components/responses/Error' }
  /promotion-candidates/{candidate_id}/eligibility:
    patch:
      operationId: updatePromotionEligibility
      summary: Record the owner's manual product eligibility check
      description: This records a creator claim after checking their own platform account backend. It does not verify platform eligibility.
      parameters:
        - { $ref: '#/components/parameters/CandidateId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionEligibilityUpdate' }
      responses:
        '200':
          description: Updated candidate; server assigns checked_at, checked_by, and next revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionCandidate' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /evidence:
    get:
      operationId: listEvidence
      summary: List the current owner's evidence records
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: source_type
          in: query
          required: false
          schema: { type: string, enum: [manual, licensed] }
        - name: q
          in: query
          required: false
          description: Trimmed case-insensitive search across source note and URL
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Stable descending created_at/id page, owner-scoped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '422': { $ref: '#/components/responses/Error' }
  /metrics:
    get:
      operationId: listMetricObservations
      summary: List the current owner's metric observations
      description: Comparable rankings and charts must stay within the same platform, object range, metric, unit, basis and time window; insufficient evidence renders as "not obtained", never a forced rank.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: platform
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Platform' }
        - name: object_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ObjectType' }
        - name: metric_name
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MetricName' }
        - name: basis
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MetricBasis' }
        - name: book_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Stable descending observed_at/id page, owner-scoped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricObservationPage' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createMetricObservation
      summary: Record one metric observation with its source evidence and basis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricObservationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricObservation' }
        '422': { $ref: '#/components/responses/Error' }
  /metrics/{observation_id}:
    get:
      operationId: getMetricObservation
      parameters:
        - { $ref: '#/components/parameters/ObservationId' }
      responses:
        '200':
          description: Observation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricObservation' }
        '404': { $ref: '#/components/responses/Error' }
  /content-references:
    get:
      operationId: listContentReferences
      summary: List the current owner's research content references
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: platform
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Platform' }
        - name: ref_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ObjectType' }
        - name: book_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Stable descending created_at/id page, owner-scoped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReferencePage' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createContentReference
      summary: Save a research reference with usage basis; no third-party media or full subtitles are stored as production assets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentReferenceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReference' }
        '422': { $ref: '#/components/responses/Error' }
  /content-references/{reference_id}:
    get:
      operationId: getContentReference
      parameters:
        - { $ref: '#/components/parameters/ReferenceId' }
      responses:
        '200':
          description: Reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReference' }
        '404': { $ref: '#/components/responses/Error' }
  /style-cards:
    get:
      operationId: listStyleCards
      summary: List the current owner's style cards
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: review_status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StyleCardStatus' }
        - name: target_platform
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Platform' }
        - name: book_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Stable descending created_at/id page, owner-scoped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleCardPage' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createStyleCard
      summary: Create a style card draft or pending card with evidence-linked abstract features
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StyleCardCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleCard' }
        '422': { $ref: '#/components/responses/Error' }
  /style-cards/{style_card_id}:
    get:
      operationId: getStyleCard
      parameters:
        - { $ref: '#/components/parameters/StyleCardId' }
      responses:
        '200':
          description: Style card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleCard' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateStyleCard
      summary: Human revision of an existing style card; revision conflict returns 409
      parameters:
        - { $ref: '#/components/parameters/StyleCardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StyleCardUpdate' }
      responses:
        '200':
          description: Updated card with incremented revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleCard' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /style-cards/{style_card_id}/review:
    post:
      operationId: reviewStyleCard
      summary: Human approve or reject a style card; approval requires valid evidence
      parameters:
        - { $ref: '#/components/parameters/StyleCardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StyleCardReview' }
      responses:
        '200':
          description: Reviewed card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleCard' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /imports:
    get:
      operationId: listImports
      summary: List the current owner's CSV import jobs
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ImportStatus' }
      responses:
        '200':
          description: Stable descending created_at/id page, owner-scoped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPage' }
        '422': { $ref: '#/components/responses/Error' }
  /imports/preview:
    post:
      operationId: previewImport
      summary: Parse a CSV without writing business data; return diagnostics and mapping suggestions
      description: UTF-8 with optional BOM; maximum file size and row count enforced server-side. Formula-prefixed cells are flagged, never executed. The preview draft expires and writes nothing on its own.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportPreviewRequest' }
      responses:
        '200':
          description: Preview diagnostics; no business rows persisted yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /imports/{import_id}:
    get:
      operationId: getImport
      parameters:
        - { $ref: '#/components/parameters/ImportId' }
      responses:
        '200':
          description: Import job status, counts and row-level failures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '404': { $ref: '#/components/responses/Error' }
  /imports/{import_id}/confirm:
    post:
      operationId: confirmImport
      summary: Apply a previously previewed CSV with the approved mapping; partial failures are recorded per row
      parameters:
        - { $ref: '#/components/parameters/ImportId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportConfirm' }
      responses:
        '200':
          description: Applied, partially applied or fully failed import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /creative-projects:
    get:
      operationId: listCreativeProjects
      summary: List the current owner's creative projects
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: book_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Stable descending created_at/id page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreativeProjectPage' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCreativeProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreativeProjectCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreativeProject' }
        '422': { $ref: '#/components/responses/Error' }
  /creative-projects/{project_id}:
    get:
      operationId: getCreativeProject
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '200':
          description: Creative project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreativeProject' }
        '404': { $ref: '#/components/responses/Error' }
  /creative-projects/{project_id}/workspace:
    get:
      operationId: getCreativeWorkspace
      summary: Reload the owner-scoped project and its local work state
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '200':
          description: Project, exact book edition, candidate, evidence, scripts, runs, renders, and latest package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreativeWorkspace' }
        '404': { $ref: '#/components/responses/Error' }
  /creative-projects/{project_id}/scripts:
    get:
      operationId: listScriptVersions
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScriptVersion' }
    post:
      operationId: saveScriptVersion
      summary: Save edited script as a new version
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScriptVersionCreate' }
      responses:
        '201':
          description: New version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScriptVersion' }
        '409': { $ref: '#/components/responses/Error' }
  /creative-projects/{project_id}/runs:
    post:
      operationId: startRun
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCreate' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: Current run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Error' }
  /runs/{run_id}/generation-results:
    get:
      operationId: listGenerationResults
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: Model or deterministic generation attempts for this owner and run
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GenerationResult' } }
        '404': { $ref: '#/components/responses/Error' }
  /runs/{run_id}/costs:
    get:
      operationId: listRunCosts
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: One cost record per actual model invocation; unknown amounts remain null
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ModelCostRecord' } }
        '404': { $ref: '#/components/responses/Error' }
  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Request cancellation of a queued, running, or review-waiting run
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Current run; an active worker may still be finishing cancellation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{run_id}/retry:
    post:
      operationId: retryRun
      summary: Requeue a failed run using its original immutable inputs
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Same run ID, incremented attempt, queued status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string }, description: Last received sequence }
      responses:
        '200':
          description: SSE events; data payload is RunEvent from events.schema.json
          content:
            text/event-stream:
              schema: { type: string }
  /runs/{run_id}/review:
    post:
      operationId: reviewRun
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Review stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { $ref: '#/components/responses/Error' }
  /renders:
    post:
      operationId: startRender
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderCreate' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /audio-assets:
    get:
      operationId: listAudioAssets
      summary: List the owner's registered audio assets
      responses:
        '200':
          description: Metadata only; no local storage paths
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AudioAsset' } }
    post:
      operationId: uploadAudioAsset
      summary: Upload and register an owner's voice file and rights claim
      description: Server checks ownership, SHA-256, media type, size and ffprobe duration before storing. A client path or URL is never accepted as render input.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AudioAssetUpload' }
      responses:
        '201':
          description: Registered metadata with server-computed usage status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudioAsset' }
        '422': { $ref: '#/components/responses/Error' }
  /audio-assets/{audio_asset_id}:
    get:
      operationId: getAudioAsset
      parameters:
        - { $ref: '#/components/parameters/AudioAssetId' }
      responses:
        '200':
          description: Current rights state evaluated at read time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudioAsset' }
        '404': { $ref: '#/components/responses/Error' }
  /renders/{render_id}:
    get:
      operationId: getRender
      parameters:
        - { $ref: '#/components/parameters/RenderId' }
      responses:
        '200':
          description: Render state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '404': { $ref: '#/components/responses/Error' }
  /renders/{render_id}/cancel:
    post:
      operationId: cancelRender
      summary: Request cancellation of a queued or running render
      parameters:
        - { $ref: '#/components/parameters/RenderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Current render; an active worker may still be finishing cancellation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /renders/{render_id}/retry:
    post:
      operationId: retryRender
      summary: Requeue a failed render with its original approved inputs
      parameters:
        - { $ref: '#/components/parameters/RenderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Same render ID, incremented attempt, queued status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /renders/{render_id}/download:
    get:
      operationId: downloadRender
      summary: Download an owner-scoped completed MP4 generated by this service
      parameters:
        - { $ref: '#/components/parameters/RenderId' }
      responses:
        '200':
          description: Completed MP4
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /creative-projects/{project_id}/publication-package:
    get:
      operationId: getPublicationPackage
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '200':
          description: Download metadata and manual publication checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationPackage' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    BookId: { name: book_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    FactKey: { name: fact_key, in: path, required: true, description: URI-encoded fact key within one exact book edition, schema: { type: string, minLength: 1 } }
    CandidateId: { name: candidate_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    AudioAssetId: { name: audio_asset_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ProjectId: { name: project_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    RunId: { name: run_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    RenderId: { name: render_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ObservationId: { name: observation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ReferenceId: { name: reference_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    StyleCardId: { name: style_card_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ImportId: { name: import_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, required: false, description: Opaque owner- and filter-bound cursor from the previous page, schema: { type: string, minLength: 1 } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    Id: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    Platform: { type: string, enum: [douyin, kuaishou] }
    RunStatus: { type: string, enum: [queued, running, waiting_review, succeeded, failed, cancelled] }
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }
    BookFact:
      type: object
      required: [key, value, verification_status]
      properties:
        key: { type: string }
        value: { type: string }
        verification_status: { type: string, enum: [unverified, source_verified, human_confirmed] }
        source_note: { type: [string, 'null'] }
        evidence_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        revision: { type: integer, minimum: 1, description: Present on persisted facts; absent from create requests for v0.2 compatibility }
    BookFactRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, value, verification_status, source_note]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        value: { type: string, minLength: 1 }
        verification_status: { type: string, enum: [unverified, source_verified, human_confirmed] }
        source_note: { type: [string, 'null'], maxLength: 1000 }
        evidence_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
      allOf:
        - if: { properties: { verification_status: { const: source_verified } }, required: [verification_status] }
          then: { anyOf: [{ properties: { source_note: { type: string, minLength: 1 } } }, { required: [evidence_id], properties: { evidence_id: { $ref: '#/components/schemas/Id' } } }] }
        - if: { properties: { verification_status: { const: human_confirmed } }, required: [verification_status] }
          then: { properties: { source_note: { type: string, minLength: 1 } } }
    BookFactRevision:
      type: object
      required: [book_id, key, revision, value, verification_status, source_note, evidence_id, created_at, created_by_user_id]
      properties:
        book_id: { $ref: '#/components/schemas/Id' }
        key: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        value: { type: string, minLength: 1 }
        verification_status: { type: string, enum: [unverified, source_verified, human_confirmed] }
        source_note: { type: [string, 'null'] }
        evidence_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        created_by_user_id: { $ref: '#/components/schemas/Id' }
    BookCreate:
      type: object
      required: [title, edition_label, author, original_opinion, facts]
      properties:
        isbn: { type: [string, 'null'] }
        title: { type: string, minLength: 1 }
        edition_label: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        publisher: { type: [string, 'null'] }
        original_opinion: { type: string, minLength: 1 }
        facts: { type: array, items: { $ref: '#/components/schemas/BookFact' } }
    BookEdition:
      allOf:
        - { $ref: '#/components/schemas/BookCreate' }
        - type: object
          required: [id, owner_user_id, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            owner_user_id: { $ref: '#/components/schemas/Id' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
    BookPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BookEdition' } }
        next_cursor: { type: [string, 'null'] }
    PromotionCandidateCreate:
      type: object
      additionalProperties: false
      required: [book_id, platform, platform_product_id, product_url]
      properties:
        book_id: { $ref: '#/components/schemas/Id' }
        platform: { $ref: '#/components/schemas/Platform' }
        platform_product_id: { type: string, minLength: 1 }
        product_url: { type: string, format: uri }
        eligibility_status: { type: string, const: unverified, default: unverified }
        eligibility_checked_at: { type: 'null' }
        eligibility_note: { type: [string, 'null'] }
    PromotionCandidate:
      type: object
      required: [id, owner_user_id, created_at, book_id, platform, platform_product_id, product_url, eligibility_status, eligibility_checked_at, eligibility_note, eligibility_revision, eligibility_checked_by_user_id]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        book_id: { $ref: '#/components/schemas/Id' }
        platform: { $ref: '#/components/schemas/Platform' }
        platform_product_id: { type: string, minLength: 1 }
        product_url: { type: string, format: uri }
        eligibility_status: { type: string, enum: [unverified, manually_confirmed] }
        eligibility_checked_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        eligibility_note: { type: [string, 'null'] }
        eligibility_revision: { type: integer, minimum: 1 }
        eligibility_checked_by_user_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    PromotionEligibilityUpdate:
      type: object
      required: [eligibility_status, expected_revision, eligibility_note, confirmation_basis]
      properties:
        eligibility_status: { type: string, enum: [unverified, manually_confirmed] }
        expected_revision: { type: integer, minimum: 1 }
        eligibility_note: { type: [string, 'null'], maxLength: 500 }
        confirmation_basis: { type: [string, 'null'], enum: [creator_account_backend, null] }
      allOf:
        - if:
            properties:
              eligibility_status: { const: manually_confirmed }
          then:
            properties:
              eligibility_note: { type: string, minLength: 1, maxLength: 500 }
              confirmation_basis: { const: creator_account_backend }
        - if:
            properties:
              eligibility_status: { const: unverified }
          then:
            properties:
              confirmation_basis: { type: 'null' }
    EvidenceCreate:
      type: object
      required: [source_type, source_note, observed_at, usage_basis]
      properties:
        source_type: { type: string, enum: [manual, licensed] }
        source_note: { type: string, minLength: 1 }
        source_url: { type: [string, 'null'], format: uri }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        usage_basis: { type: string, minLength: 1 }
        metric_name: { type: [string, 'null'] }
        metric_value: { type: [number, 'null'] }
        metric_window_start: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        metric_window_end: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        missing_reason: { type: [string, 'null'] }
    Evidence:
      allOf:
        - { $ref: '#/components/schemas/EvidenceCreate' }
        - type: object
          required: [id, owner_user_id, collected_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            owner_user_id: { $ref: '#/components/schemas/Id' }
            collected_at: { $ref: '#/components/schemas/Timestamp' }
    CreativeProjectCreate:
      type: object
      required: [book_id, promotion_candidate_id, target_audience, target_platform, desired_seconds, original_angle]
      properties:
        book_id: { $ref: '#/components/schemas/Id' }
        promotion_candidate_id: { $ref: '#/components/schemas/Id' }
        target_audience: { type: string, minLength: 1 }
        target_platform: { $ref: '#/components/schemas/Platform' }
        desired_seconds: { type: integer, minimum: 20, maximum: 45 }
        original_angle: { type: string, minLength: 1 }
        tone_instruction: { type: [string, 'null'], maxLength: 500, description: Optional creator voice or tone guidance; no new audience, platform, duration or claim fields }
        prohibited_claims: { type: array, items: { type: string }, default: [] }
        evidence_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, default: [] }
    CreativeProject:
      allOf:
        - { $ref: '#/components/schemas/CreativeProjectCreate' }
        - type: object
          required: [id, owner_user_id, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            owner_user_id: { $ref: '#/components/schemas/Id' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
    CreativeProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CreativeProject' } }
        next_cursor: { type: [string, 'null'] }
    CreativeWorkspace:
      type: object
      required: [project, book, promotion_candidate, evidence, script_versions, runs, render_jobs, publication_package]
      properties:
        project: { $ref: '#/components/schemas/CreativeProject' }
        book: { $ref: '#/components/schemas/BookEdition' }
        promotion_candidate: { $ref: '#/components/schemas/PromotionCandidate' }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        script_versions: { type: array, items: { $ref: '#/components/schemas/ScriptVersion' } }
        runs: { type: array, items: { $ref: '#/components/schemas/Run' } }
        render_jobs: { type: array, items: { $ref: '#/components/schemas/RenderJob' } }
        publication_package: { anyOf: [{ $ref: '#/components/schemas/PublicationPackage' }, { type: 'null' }] }
    ScriptSegment:
      type: object
      required: [order, onscreen_text, narration, fact_keys, duration_seconds]
      properties:
        order: { type: integer, minimum: 0 }
        onscreen_text: { type: string }
        narration: { type: string }
        fact_keys: { type: array, items: { type: string } }
        duration_seconds: { type: number, exclusiveMinimum: 0 }
    ScriptVersionCreate:
      type: object
      required: [segments, title_suggestion, description_suggestion]
      properties:
        based_on_version_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        segments: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ScriptSegment' } }
        title_suggestion: { type: string }
        description_suggestion: { type: string }
    ScriptVersion:
      allOf:
        - { $ref: '#/components/schemas/ScriptVersionCreate' }
        - type: object
          required: [id, project_id, owner_user_id, version_number, review_status, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            project_id: { $ref: '#/components/schemas/Id' }
            owner_user_id: { $ref: '#/components/schemas/Id' }
            version_number: { type: integer, minimum: 1 }
            review_status: { type: string, enum: [pending, approved, rejected] }
            generation_result_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: Null for manual edits; generated drafts link to one completed result }
            fact_revision_refs: { type: array, items: { $ref: '#/components/schemas/FactRevisionRef' }, description: Immutable book fact revisions checked for this script version }
            created_at: { $ref: '#/components/schemas/Timestamp' }
    FactRevisionRef:
      type: object
      required: [key, revision]
      properties:
        key: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
    GenerationResult:
      type: object
      required: [id, run_id, owner_user_id, attempt, invocation_key, source, provider_key, model_key, status, reason_code, input_digest, output_digest, script_version_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        run_id: { $ref: '#/components/schemas/Id' }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        attempt: { type: integer, minimum: 1 }
        invocation_key: { type: string, minLength: 1, description: Stable server-derived key reused on a retry of the same logical call }
        source: { type: string, enum: [deterministic_fixture, external_model] }
        provider_key: { type: string, minLength: 1 }
        model_key: { type: string, minLength: 1 }
        status: { type: string, enum: [succeeded, failed] }
        reason_code: { type: [string, 'null'], enum: [null, provider_unavailable, provider_timeout, invalid_output, unsupported_claim, missing_fact_basis, prohibited_claim, cancelled, manual_reconciliation_required] }
        input_digest: { type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of canonical request without prompt text }
        output_digest: { type: [string, 'null'], description: SHA-256 of canonical structured output on success }
        script_version_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
      allOf:
        - if: { properties: { status: { const: succeeded } }, required: [status] }
          then: { properties: { reason_code: { type: 'null' }, output_digest: { type: string, pattern: '^[a-f0-9]{64}$' }, script_version_id: { $ref: '#/components/schemas/Id' } } }
        - if: { properties: { status: { const: failed } }, required: [status] }
          then: { properties: { reason_code: { type: string }, output_digest: { type: 'null' }, script_version_id: { type: 'null' } } }
    ModelCostRecord:
      type: object
      required: [id, run_id, owner_user_id, generation_result_id, currency, amount_minor, missing_reason, input_tokens, output_tokens, recorded_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        run_id: { $ref: '#/components/schemas/Id' }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        generation_result_id: { $ref: '#/components/schemas/Id', description: Unique; exactly one cost record for an actual invocation or zero-cost deterministic fixture }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount_minor: { type: [integer, 'null'], minimum: 0, description: Actual billed amount in minor units; null if unavailable, never an estimate disguised as billed cost }
        missing_reason: { type: [string, 'null'] }
        input_tokens: { type: [integer, 'null'], minimum: 0 }
        output_tokens: { type: [integer, 'null'], minimum: 0 }
        recorded_at: { $ref: '#/components/schemas/Timestamp' }
      allOf:
        - if: { properties: { amount_minor: { type: 'null' } }, required: [amount_minor] }
          then: { properties: { missing_reason: { type: string, minLength: 1 } } }
        - if: { properties: { amount_minor: { type: integer } }, required: [amount_minor] }
          then: { properties: { missing_reason: { type: 'null' } } }
    RunCreate:
      type: object
      required: [brief_version]
      properties:
        brief_version: { type: integer, minimum: 1 }
    Run:
      type: object
      required: [id, project_id, owner_user_id, status, stage, sequence, attempt, cancel_requested_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        project_id: { $ref: '#/components/schemas/Id' }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/RunStatus' }
        stage: { type: string, enum: [prepare, script, fact_check, review, storyboard, render, complete] }
        sequence: { type: integer, minimum: 0 }
        attempt: { type: integer, minimum: 1 }
        cancel_requested_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ReviewRequest:
      type: object
      required: [script_version_id, decision, fact_confirmed, product_match_confirmed, asset_rights_confirmed]
      properties:
        script_version_id: { $ref: '#/components/schemas/Id' }
        decision: { type: string, enum: [approve, reject] }
        note: { type: [string, 'null'] }
        fact_confirmed: { type: boolean }
        product_match_confirmed: { type: boolean }
        asset_rights_confirmed: { type: boolean }
    AssetRights:
      type: object
      required: [origin, usage_status]
      properties:
        origin: { type: string, enum: [self_created_text, self_created_graphic, self_recorded_voice, licensed] }
        usage_status: { type: string, enum: [allowed, blocked] }
        license_basis: { type: [string, 'null'] }
        permitted_uses: { type: array, items: { type: string }, default: [] }
        proof_ref: { type: [string, 'null'] }
        expires_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    AudioAssetUpload:
      type: object
      additionalProperties: false
      required: [file, sha256, origin, rights_attested, rights_proof_note, permitted_uses]
      properties:
        file: { type: string, format: binary, description: Audio bytes; server accepts only configured safe media formats and size limits }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: Client digest verified against received bytes }
        origin: { type: string, enum: [self_recorded_voice, licensed_voice] }
        rights_attested: { type: boolean, const: true, description: Creator explicitly attests ownership or valid commercial permission }
        rights_proof_note: { type: string, minLength: 1, maxLength: 1000, description: For self-recording identify creator's own recording; for licensed voice identify commercial permission scope }
        permitted_uses: { type: string, const: render_and_manual_publish }
        expires_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
      allOf:
        - if: { properties: { origin: { const: licensed_voice } }, required: [origin] }
          then: { required: [expires_at, permitted_uses], properties: { expires_at: { $ref: '#/components/schemas/Timestamp' } } }
    AudioAsset:
      type: object
      required: [id, owner_user_id, origin, sha256, mime_type, duration_ms, rights_attested, rights_proof_note, permitted_uses, expires_at, usage_status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        origin: { type: string, enum: [self_recorded_voice, licensed_voice] }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        mime_type: { type: string, enum: [audio/wav, audio/mpeg, audio/mp4] }
        duration_ms: { type: integer, minimum: 1, maximum: 45000 }
        rights_attested: { type: boolean }
        rights_proof_note: { type: string }
        permitted_uses: { type: string, enum: [render_and_manual_publish] }
        expires_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        usage_status: { type: string, enum: [allowed, blocked], description: Server-computed on read and before each render, including permission expiry }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    RenderCreate:
      type: object
      additionalProperties: false
      required: [project_id, script_version_id, promotion_candidate_id, width, height, asset_rights]
      properties:
        project_id: { $ref: '#/components/schemas/Id' }
        script_version_id: { $ref: '#/components/schemas/Id' }
        promotion_candidate_id: { $ref: '#/components/schemas/Id' }
        width: { type: integer, const: 1080 }
        height: { type: integer, const: 1920 }
        audio_asset_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: Null makes a silent video; non-null must be an allowed owner-held audio asset. Never a client file path. }
        asset_rights: { type: array, items: { $ref: '#/components/schemas/AssetRights' } }
    RenderJob:
      type: object
      required: [id, project_id, script_version_id, owner_user_id, status, attempt, cancel_requested_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        project_id: { $ref: '#/components/schemas/Id' }
        script_version_id: { $ref: '#/components/schemas/Id' }
        audio_asset_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/RunStatus' }
        attempt: { type: integer, minimum: 1 }
        cancel_requested_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        output_ref: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    PublicationPackage:
      type: object
      required: [id, project_id, book_id, script_version_id, promotion_candidate_id, render_id, title, description, video_download_url, publication_state, checklist]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        project_id: { $ref: '#/components/schemas/Id' }
        book_id: { $ref: '#/components/schemas/Id' }
        script_version_id: { $ref: '#/components/schemas/Id' }
        promotion_candidate_id: { $ref: '#/components/schemas/Id' }
        render_id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        description: { type: string }
        cover_text: { type: string }
        video_download_url: { type: string, format: uri }
        publication_state: { type: string, enum: [needs_manual_checks, ready_for_manual_publish] }
        checklist:
          type: object
          required: [account_eligible, product_eligible, edition_matches, rights_confirmed, manual_attachment_required]
          properties:
            account_eligible: { type: boolean }
            product_eligible: { type: boolean }
            edition_matches: { type: boolean }
            rights_confirmed: { type: boolean }
            manual_attachment_required: { type: boolean, const: true }
    EvidencePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        next_cursor: { type: [string, 'null'] }
    ObjectType:
      type: string
      enum: [product_listing, creator_account, content_item, book_edition]
    MetricBasis:
      type: string
      enum:
        - authorized_order_sales
        - platform_listing_display
        - third_party_or_manual_estimate
        - engagement_signal
        - legacy_unclassified
      description: >
        authorized_order_sales: actual authorized merchant order data (the only basis that may be called real sales).
        platform_listing_display: a value shown on a platform page; not an authorized order feed.
        third_party_or_manual_estimate: estimate from a licensed third-party service or a person; never presented as actual sales.
        engagement_signal: plays, likes, comments, shares, followers, ranking, search heat; attention signal, never sales.
        legacy_unclassified: v0.3 legacy record whose basis could not be classified; treated as an estimate until re-validated.
    MetricName:
      type: string
      enum: [sales_units, sales_amount, listed_price, displayed_sales_label, plays, likes, comments, shares, favorites, follower_count, ranking_position, search_heat, other]
    MetricUnit:
      type: string
      enum: [count, minor_currency, currency_yuan, views, likes, percent, rank, score, text, unspecified]
    MetricObservationCreate:
      type: object
      required: [object_type, object_ref, metric_name, metric_definition, basis, unit, value, observed_at]
      properties:
        platform: { anyOf: [{ $ref: '#/components/schemas/Platform' }, { type: 'null' }] }
        book_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        object_type: { $ref: '#/components/schemas/ObjectType' }
        object_ref: { type: string, minLength: 1, maxLength: 200, description: Platform-native stable ID or a stable manual label; never a free-text display name }
        object_label: { type: [string, 'null'], maxLength: 200 }
        metric_name: { $ref: '#/components/schemas/MetricName' }
        metric_definition: { type: string, minLength: 1, maxLength: 500, description: Exact definition, scope and calculation口径 behind this value }
        basis: { $ref: '#/components/schemas/MetricBasis' }
        unit: { $ref: '#/components/schemas/MetricUnit' }
        value: { type: [number, 'null'], description: Numeric value; null means the datum is missing (with missing_reason). Never use 0 to mean unknown; a real measured zero is 0 with an evidence link. }
        value_text: { type: [string, 'null'], maxLength: 100, description: Non-numeric platform label such as "10万+"; only for display labels, never a ranked number }
        window_start: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        window_end: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        evidence_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        missing_reason: { type: [string, 'null'], maxLength: 500 }
        confidence: { anyOf: [{ type: 'string', enum: [high, medium, low] }, { type: 'null' }] }
        expires_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        note: { type: [string, 'null'], maxLength: 1000 }
      allOf:
        - if:
            properties: { value: { type: 'null' } }
            required: [value]
          then:
            properties:
              missing_reason: { type: 'string', minLength: 1 }
              evidence_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        - if:
            properties: { value: { not: { type: 'null' } } }
            required: [value]
          then:
            required: [evidence_id]
            properties:
              evidence_id: { $ref: '#/components/schemas/Id' }
              missing_reason: { type: 'null' }
        - if:
            properties: { window_start: { type: 'string' } }
            required: [window_start]
          then:
            required: [window_end]
            properties: { window_end: { type: 'string' } }
        - if:
            properties: { basis: { enum: [authorized_order_sales, third_party_or_manual_estimate, engagement_signal] } }
            required: [basis]
          then:
            required: [window_start, window_end]
    MetricObservation:
      allOf:
        - { $ref: '#/components/schemas/MetricObservationCreate' }
        - type: object
          required: [id, owner_user_id, collected_at, legacy_backfill]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            owner_user_id: { $ref: '#/components/schemas/Id' }
            collected_at: { $ref: '#/components/schemas/Timestamp' }
            legacy_backfill: { type: boolean, default: false, description: True when migrated from a v0.3 evidence record; basis must be re-validated before ranking }
    MetricObservationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MetricObservation' } }
        next_cursor: { type: [string, 'null'] }
    ContentReferenceCreate:
      type: object
      required: [ref_type, title, license_scope, usage_basis, material_statement]
      properties:
        platform: { anyOf: [{ $ref: '#/components/schemas/Platform' }, { type: 'null' }] }
        book_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        ref_type: { $ref: '#/components/schemas/ObjectType' }
        external_ref: { type: [string, 'null'], maxLength: 200 }
        reference_url: { type: [string, 'null'], format: uri, description: Source link for research traceability; a link is not a reuse license }
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 1000, description: Abstract observational note; no third-party full transcript or verbatim copy }
        license_scope: { type: string, enum: [own_account, licensed_data_service, manual_observation] }
        usage_basis: { type: string, minLength: 1, maxLength: 500, description: Why this reference may be consulted and the permitted reuse scope }
        captured_fields:
          type: array
          items: { type: string, enum: [title, author, platform_ref, url, observed_note, publication_date, platform_label] }
          default: []
        evidence_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, default: [] }
        observed_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        material_statement: { type: string, const: no_third_party_media_or_verbatim_transcript, description: Explicit declaration that no video, audio, cover image, product image or full subtitle/transcript is stored for reuse in production }
    ContentReference:
      allOf:
        - { $ref: '#/components/schemas/ContentReferenceCreate' }
        - type: object
          required: [id, owner_user_id, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            owner_user_id: { $ref: '#/components/schemas/Id' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
    ContentReferencePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ContentReference' } }
        next_cursor: { type: [string, 'null'] }
    StyleCardStatus:
      type: string
      enum: [draft, pending_review, approved, rejected]
    StyleFeature:
      type: object
      additionalProperties: false
      required: [feature_key, label, explanation, evidence_ids, sample_count]
      properties:
        feature_key: { type: string, enum: [opening_hook, narrative_structure, pacing, visual_style, subtitle_style, tone, cta, audience_match, other] }
        label: { type: string, minLength: 1, maxLength: 100, description: Abstract short tag, e.g. "反常识开场提问" }
        explanation: { type: string, minLength: 1, maxLength: 500, description: Abstract description; no verbatim third-party subtitle or copied script }
        evidence_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, minItems: 1 }
        sample_count: { type: integer, minimum: 1 }
    StyleCardCreate:
      type: object
      required: [title, derived_by]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        target_platform: { anyOf: [{ $ref: '#/components/schemas/Platform' }, { type: 'null' }] }
        book_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        derived_by: { type: string, enum: [manual, workflow_extraction], default: manual }
        features: { type: array, items: { $ref: '#/components/schemas/StyleFeature' }, default: [] }
        evidence_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, default: [] }
        reference_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, default: [] }
        human_note: { type: [string, 'null'], maxLength: 1000 }
    StyleCardUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        target_platform: { anyOf: [{ $ref: '#/components/schemas/Platform' }, { type: 'null' }] }
        features: { type: array, items: { $ref: '#/components/schemas/StyleFeature' } }
        evidence_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        reference_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        human_note: { type: [string, 'null'], maxLength: 1000 }
    StyleCardReview:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: [string, 'null'], maxLength: 1000 }
      allOf:
        - if: { properties: { decision: { const: reject } }, required: [decision] }
          then: { properties: { note: { type: 'string', minLength: 1, maxLength: 1000 } } }
    StyleCard:
      allOf:
        - { $ref: '#/components/schemas/StyleCardCreate' }
        - type: object
          required: [id, owner_user_id, created_at, updated_at, revision, review_status, edited_by_user_id, last_edited_at, abstract_only, evidence_sample_count]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            owner_user_id: { $ref: '#/components/schemas/Id' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
            updated_at: { $ref: '#/components/schemas/Timestamp' }
            revision: { type: integer, minimum: 1 }
            review_status: { $ref: '#/components/schemas/StyleCardStatus' }
            edited_by_user_id: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
            last_edited_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            abstract_only: { type: boolean, const: true }
            evidence_sample_count: { type: integer, minimum: 0, description: Number of distinct evidence records backing this card }
    StyleCardPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StyleCard' } }
        next_cursor: { type: [string, 'null'] }
    ImportStatus:
      type: string
      enum: [preview, applied, partially_applied, failed]
    ImportRowDiagnostic:
      type: object
      additionalProperties: false
      required: [row_number, code, message, severity]
      properties:
        row_number: { type: integer, minimum: 1 }
        field: { type: [string, 'null'], maxLength: 100 }
        code:
          type: string
          enum:
            - encoding_error
            - malformed_row
            - missing_required_field
            - invalid_book_isbn
            - invalid_number
            - invalid_timestamp
            - invalid_platform
            - invalid_url
            - formula_injection
            - duplicate_natural_key
            - edition_mismatch_suspected
            - unknown_column
            - field_too_long
            - invalid_mapping
            - reference_rights_unsupported
        message: { type: string, maxLength: 500 }
        severity: { type: string, enum: [error, warning] }
    ImportPreviewRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: CSV text file; UTF-8 with optional BOM. Size and row limits enforced server-side; bytes are never executed. }
        filename_hint: { type: string, maxLength: 200 }
    ImportPreview:
      type: object
      required: [id, owner_user_id, status, filename, encoding_detected, file_sha256, size_bytes, columns, total_rows, parsed_rows, valid_rows, failed_rows, skipped_duplicate_rows, mapping_suggestions, row_diagnostics, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ImportStatus' }
        filename: { type: string, maxLength: 200 }
        encoding_detected: { type: string, enum: [utf8, utf8_bom, unknown] }
        file_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 0 }
        columns: { type: array, items: { type: string } }
        total_rows: { type: integer, minimum: 0 }
        parsed_rows: { type: integer, minimum: 0 }
        valid_rows: { type: integer, minimum: 0 }
        failed_rows: { type: integer, minimum: 0 }
        skipped_duplicate_rows: { type: integer, minimum: 0 }
        mapping_suggestions: { type: object, additionalProperties: { type: [string, 'null'] }, description: Suggested target field per source column; the confirm request supplies the final mapping }
        row_diagnostics: { type: array, items: { $ref: '#/components/schemas/ImportRowDiagnostic' } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp', description: Preview draft TTL; expired previews cannot be confirmed }
    ImportConfirm:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping: { type: object, additionalProperties: { type: ['string', 'null'] }, description: Source column to target field mapping; unmapped columns are ignored }
        on_duplicate: { type: string, enum: [skip, update], default: skip }
        match_by: { type: string, enum: [isbn, isbn_and_edition, title_author_fuzzy], default: isbn_and_edition }
        normalize_isbn: { type: boolean, default: true }
        note: { type: [string, 'null'], maxLength: 500 }
    ImportCounts:
      type: object
      required: [total, parsed, persisted, skipped_duplicate, failed, warnings]
      properties:
        total: { type: integer, minimum: 0 }
        parsed: { type: integer, minimum: 0 }
        persisted: { type: integer, minimum: 0 }
        skipped_duplicate: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
    ImportJob:
      type: object
      required: [id, owner_user_id, status, filename, file_sha256, created_at, updated_at, counts, row_diagnostics, entity_kinds, mapping]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        owner_user_id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ImportStatus' }
        filename: { type: string, maxLength: 200 }
        file_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        counts: { $ref: '#/components/schemas/ImportCounts' }
        row_diagnostics: { type: array, items: { $ref: '#/components/schemas/ImportRowDiagnostic' } }
        entity_kinds: { type: array, items: { type: string, enum: [book_edition, promotion_candidate, metric_observation, evidence, content_reference] } }
        mapping: { type: object, additionalProperties: { type: ['string', 'null'] } }
        on_duplicate: { type: string, enum: [skip, update] }
        match_by: { type: string, enum: [isbn, isbn_and_edition, title_author_fuzzy] }
    ImportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ImportJob' } }
        next_cursor: { type: [string, 'null'] }
